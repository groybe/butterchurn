<!DOCTYPE html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="./favicon.ico" type="image/x-icon">
  <title>Butterchurn Demo</title>
  <meta name="description" content="Butterchurn Demo Example">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- <script type="text/javascript" src="../dist/butterchurn.js"></script> -->
  <script type="text/javascript" src="./libs/lodash.js"></script>
  <script type="text/javascript" src="./libs/base.min.js"></script>
  <script type="text/javascript" src="./libs/extra.min.js"></script>
  <script
    src="./libs/jquery-3.1.1.min.js"
    integrity="sha256-hVVnYaiADRTO2PzUGmuLJr8BLUSjGIZsDYGmIJLv2b8="
    crossorigin="anonymous"></script>

  <style>

    #fpsDisplay {
      position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
      color: white;
      z-index: 10;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 20px;
      border-radius: 10px;
      font-size: 100px;
      display: none;
    }

    #audioSettingsWrapper {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 20;
    background: rgba(0, 0, 0, 0.75);
    color: #fff;
    padding: 20px;
    border-radius: 10px;
    }

    #canvas:-moz-full-screen {
      width: 100%;
      height: 100%;
    }
    #canvas:-webkit-full-screen {
      width: 100%;
      height: 100%;
    }
    #canvas:-ms-fullscreen {
      width: 100%;
      height: 100%;
    }
    #canvas:fullscreen {
      width: 100%;
      height: 100%;
    }

    #presetSelect {
      max-width: 300px;
    }

    #presetCycleLength {
      width: 50px;
	}

	#meshSizeSelect {
      width: 100px;
    }
    
 	#frameLimit {
      width: 100px;
    }   
	
    #fullscreenBtn {
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
    }

    #localFileBtn {
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
    }

    #micSelectBtn {
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
    }

    #showFpsBtn {
      padding: 6px 12px;
      font-size: 14px;
      cursor: pointer;
    }

  </style>
  <link rel="stylesheet" href="./libs/normalize.css" />

  <script type="module">
    import butterchurn from './libs/butterchurn.js';

    $(function() {
      var visualizer = null;
      var rendering = false;
      var audioContext = null;
      var sourceNode = null;
      var delayedAudible = null;
      var cycleInterval = null;
      var presets = {};
      var presetKeys = [];
      var presetIndexHist = [];
      var presetIndex = 0;
      var presetCycle = true;
      var presetCycleLength = 25000;
      var presetRandom = true;
      var canvas = document.getElementById('canvas');
      var canvasScaleFactor = 0.5;
      var meshSizeSelect = [48, 36];
      var frameInterval = 0;
			var frameLimit = 45;
      var e = null;

      function connectToAudioAnalyzer(sourceNode) {
        if(delayedAudible) {
          delayedAudible.disconnect();
        }

        delayedAudible = audioContext.createDelay();
        delayedAudible.delayTime.value = 0.26;

        sourceNode.connect(delayedAudible)
        delayedAudible.connect(audioContext.destination);

        visualizer.connectAudio(delayedAudible);
      }

      /* function startRenderer() {
        requestAnimationFrame(() => startRenderer());
        visualizer.render();
      } */

			function startRenderer() {
				
				var lastFrameTime = performance.now();
        
        frameInterval = 1000 / frameLimit;
        
          var frameCount = 0;
					var fpsLastTime = performance.now();
        
        
        // Render loop      
        return function n() {
					if (e = window.requestAnimationFrame(n), 0 === frameLimit) visualizer.render();
						else {
							var currentFrameTime = performance.now();
              var i = currentFrameTime - lastFrameTime
              i > frameInterval &&
              (lastFrameTime = currentFrameTime - i % frameInterval, visualizer.render(), frameCount++);
              
        if (currentFrameTime - fpsLastTime >= 1000) {
        var fps = frameCount;
        $("#fpsDisplay").text(`FPS: ${fps}`);
        frameCount = 0;
        fpsLastTime = currentFrameTime;
			}
						}
				}();
      }

			function loadLocalFiles(files, index = 0) {
        if (!rendering) {
          rendering = true;
          startRenderer();	
				}
				audioContext.resume();

				const audioElement = new Audio();
				audioElement.src = URL.createObjectURL(files[index]);
				audioElement.controls = true;
				document.body.appendChild(audioElement);

				sourceNode = audioContext.createMediaElementSource(audioElement);
				connectToAudioAnalyzer(sourceNode);

				audioElement.play();

				// Optional: auto-play next file after current ends
				audioElement.onended = () => {
					if (files.length > index + 1) {
						loadLocalFiles(files, index + 1);
					} else {
						sourceNode.disconnect();
						sourceNode = null;
						$("#audioSettingsWrapper").css('display', 'block');
					}
				};
			}


      function connectMicAudio(sourceNode, audioContext) {
        audioContext.resume();

        var gainNode = audioContext.createGain();
        gainNode.gain.value = 1.25;
        sourceNode.connect(gainNode);

        visualizer.connectAudio(gainNode);
        startRenderer();
      }

      function nextPreset(blendTime = 5.7) {
        presetIndexHist.push(presetIndex);

        var numPresets = presetKeys.length;
        if (presetRandom) {
          presetIndex = Math.floor(Math.random() * presetKeys.length);
        } else {
          presetIndex = (presetIndex + 1) % numPresets;
        }

        visualizer.loadPreset(presets[presetKeys[presetIndex]], blendTime);
        $('#presetSelect').val(presetIndex);
      }

      function prevPreset(blendTime = 5.7) {
        var numPresets = presetKeys.length;
        if (presetIndexHist.length > 0) {
          presetIndex = presetIndexHist.pop();
        } else {
          presetIndex = ((presetIndex - 1) + numPresets) % numPresets;
        }

        visualizer.loadPreset(presets[presetKeys[presetIndex]], blendTime);
        $('#presetSelect').val(presetIndex);
      }

      function restartCycleInterval() {
        if (cycleInterval) {
          clearInterval(cycleInterval);
          cycleInterval = null;
        }

        if (presetCycle) {
          cycleInterval = setInterval(() => nextPreset(2.7), presetCycleLength);
        }
      }

      $(document).keydown((e) => {
        if (e.which === 32 || e.which === 39) {
          nextPreset();
        } else if (e.which === 8 || e.which === 37) {
          prevPreset();
        } else if (e.which === 72) {
          nextPreset(0);
        }
      });

      $('#presetSelect').change((evt) => {
        presetIndexHist.push(presetIndex);
        presetIndex = parseInt($('#presetSelect').val());
        visualizer.loadPreset(presets[presetKeys[presetIndex]], 5.7);
      });

      $('#presetCycle').change(() => {
        presetCycle = $('#presetCycle').is(':checked');
        restartCycleInterval();
      });

      $('#presetCycleLength').change((evt) => {
        presetCycleLength = parseInt($('#presetCycleLength').val() * 1000);
        restartCycleInterval();
      });

      $('#presetRandom').change(() => {
        presetRandom = $('#presetRandom').is(':checked');
      });

      $('#canvasScaleFactor').change((evt) => {
        canvasScaleFactor = parseFloat($('#canvasScaleFactor').val());
        canvas.width = window.innerWidth * canvasScaleFactor;
        canvas.height = window.innerHeight * canvasScaleFactor;
        visualizer.setRendererSize(canvas.width, canvas.height);
      });

      $('#meshSizeSelect').change((evt) => {
      var meshSizeSelect = evt.target.value.split("x").map(Number);
      visualizer.setInternalMeshSize(...meshSizeSelect);
      });

      $('#frameLimit').change((evt) => {
			frameLimit = parseInt($('#frameLimit').val());
			frameInterval = 1000 / frameLimit;
      });

      $("#localFileBtn").click(function() {

        var fileSelector = $('<input type="file" accept="audio/*" multiple />');

        fileSelector[0].onchange = function(event) {
          loadLocalFiles(fileSelector[0].files);
        }

        fileSelector.click();
      });
      
      $("#micSelectBtn").click(() => {

        navigator.mediaDevices.getUserMedia({ audio: true })
        .then((stream) => {
          var micSourceNode = audioContext.createMediaStreamSource(stream);
          connectMicAudio(micSourceNode, audioContext);
          })
        .catch((err) => {
          console.log('Error getting audio stream from getUserMedia');
        });
      });

$("#fullscreenBtn").click(() => {
  const wrapper = document.getElementById("mainWrapper");

  const isFullscreen =
    document.fullscreenElement ||
    document.webkitFullscreenElement ||
    document.mozFullScreenElement ||
    document.msFullscreenElement;

  if (isFullscreen) {
    // Exit fullscreen
    if (document.exitFullscreen) {
      document.exitFullscreen();
    } else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    } else if (document.mozCancelFullScreen) {
      document.mozCancelFullScreen();
    } else if (document.msExitFullscreen) {
      document.msExitFullscreen();
    }
  } else {
    // Enter fullscreen
    if (wrapper.requestFullscreen) {
      wrapper.requestFullscreen();
    } else if (wrapper.webkitRequestFullscreen) {
      wrapper.webkitRequestFullscreen();
    } else if (wrapper.mozRequestFullScreen) {
      wrapper.mozRequestFullScreen();
    } else if (wrapper.msRequestFullscreen) {
      wrapper.msRequestFullscreen();
    }
  }
});

      $("#showFpsBtn").click(() => {
          const fpsBox = $("#fpsDisplay");
          const isVisible = fpsBox.css("display") !== "none";

          fpsBox.css("display", isVisible ? "none" : "block");
      });
      
$("#refreshPWA").click(() => {
	console.log('button press');
  //caches.delete('butterchurn-cache').then(() => {
    if (navigator.serviceWorker.controller) {
			console.log('Sending service worker refresh message');
      navigator.serviceWorker.controller.postMessage({ type: "REFRESH_CACHE" });
    }
  //});
});

      
      function resizeCanvas() {
        canvas.width = window.innerWidth * canvasScaleFactor;
        canvas.height = window.innerHeight * canvasScaleFactor;
        canvas.style.width  = window.innerWidth + 'px';
        canvas.style.height = window.innerHeight + 'px';
        visualizer.setRendererSize(canvas.width, canvas.height);
      }


      let hideOverlayTimer;

      $(document).on("mousemove", function () {
        // Show the overlay immediately
        $("#audioSettingsWrapper").css('display', 'block');

        // Clear any existing hide timer
        clearTimeout(hideOverlayTimer);

        // Set a new timer to hide after 4 seconds of inactivity
        hideOverlayTimer = setTimeout(() => {
          $("#audioSettingsWrapper").css('display', 'none');
        }, 4000);
      });



      function initPlayer() {
        audioContext = new AudioContext();

        presets = {};
        if (window.base && window.base.default) {
          Object.assign(presets, window.base.default);
        }
        if (window.extra && window.extra.default) {
          Object.assign(presets, window.extra.default);
        }
        presets = _(presets).toPairs().sortBy(([k, v]) => k.toLowerCase()).fromPairs().value();
        presetKeys = _.keys(presets);
        presetIndex = Math.floor(Math.random() * presetKeys.length);

        var presetSelect = document.getElementById('presetSelect');
        for(var i = 0; i < presetKeys.length; i++) {
            var opt = document.createElement('option');
            opt.innerHTML = presetKeys[i].substring(0,60) + (presetKeys[i].length > 60 ? '...' : '');
            opt.value = i;
            presetSelect.appendChild(opt);
        }

        visualizer = butterchurn.createVisualizer(audioContext, canvas , {
          pixelRatio: window.devicePixelRatio || 1,
          textureRatio: 1,
        });
				
				//Load initial settings
				visualizer.setInternalMeshSize(...meshSizeSelect);
        resizeCanvas(); // Initial sizing

        window.addEventListener("resize", resizeCanvas);
        document.addEventListener("fullscreenchange", resizeCanvas);


        nextPreset(0);
        cycleInterval = setInterval(() => nextPreset(2.7), presetCycleLength);
      }

      initPlayer();
    });
  </script>
</head>
<body>
  <div id="mainWrapper">
    <div id="audioSettingsWrapper">
      <div id="presetControls">
        <div>Preset: <select id="presetSelect"></select></div>
        <div>Cycle: <input type="checkbox" id="presetCycle" checked></input>
                    <input type="number" id="presetCycleLength"step="1" value="25" min="1"></input>
                    Canvas Size: <input type="number" id="canvasScaleFactor"step="0.25" value="0.5" min="0.25" max="4.0"></input>
                              <label for="frameLimit">Frame Limit:</label>
          <select id="frameLimit">
            <option value="15">15</option>
            <option value="30">30</option>
            <option value="45" selected>45</option>
            <option value="60">60</option>
            <option value="75">75</option>
            <option value="90">90</option>
          </select>
                    </div>
        <div>
          Random: <input type="checkbox" id="presetRandom" checked></input>
          <button id="refreshPWA">🔁 Refresh PWA Cache</button>
          <label for="meshSizeSelect">Mesh Size:</label>
          <select id="meshSizeSelect">
            <option value="24x18">24 x 18</option>
            <option value="32x24">32 x 24</option>
            <option value="48x36" selected>48 x 36</option>
            <option value="64x48">64 x 48</option>
            <option value="96x72">96 x 72</option>
            <option value="128x96">128 x 96</option>
          </select>
        </div>
        <div>
          <button id="fullscreenBtn">Fullscreen</button>
          <button id="localFileBtn">Load local files</button>
          <button id="micSelectBtn">Use Mic</button>
          <button id="showFpsBtn">Show FPS</button>
        </div>
      </div>
    </div>
  <div id="fpsDisplay">FPS:</div>
  <canvas id='canvas' width='800' height='600'></canvas>
  </div>
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => {
        console.log('Service Worker registered with scope:', reg.scope);
      })
      .catch(err => {
        console.error('Service Worker registration failed:', err);
      });
  }
</script>
</body>
</html>
